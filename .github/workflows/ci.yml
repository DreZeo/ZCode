name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: instabox-medium
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck
        env:
          # 这个 monorepo 的 tsc 项目引用编译峰值超过 Node 默认约 2 GB 堆上限，
          # 在 instabox-medium（8 GiB）上直接 OOM，需显式放开。
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Lint
        run: pnpm lint
